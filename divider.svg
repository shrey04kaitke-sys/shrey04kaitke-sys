<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="comet2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".7" stop-color="#fbbf24"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="hl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbbf24" stop-opacity=".9"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .c1 { animation: run 4s linear infinite; }
    .c2 { animation: run2 5.5s linear -2s infinite; }
    @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1060px); } }
    @keyframes run2 { from { transform: translateX(1060px) scaleX(-1); } to { transform: translateX(-200px) scaleX(-1); } }
    .hl { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scaleX(1); opacity: .8; } 50% { transform: scaleX(1.5); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .c1, .c2, .hl { animation: none !important; } .c1, .c2 { display: none; } }
  </style>
  <rect x="0" y="13" width="1000" height="2" fill="url(#base)"/>
  <ellipse class="hl" cx="500.0" cy="14" rx="70" ry="5" fill="url(#hl)"/>
  <rect class="c1" x="0" y="12.2" width="140" height="3.6" rx="1.8" fill="url(#comet)"/>
  <g transform="translate(0 0)"><rect class="c2" x="0" y="12.2" width="110" height="3.6" rx="1.8" fill="url(#comet2)"/></g>
</svg>
