<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Shreyashi Kaitke - AI and ML Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="mono" gradientUnits="userSpaceOnUse" x1="80" y1="112" x2="330" y2="272">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="beat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="typeclip">
      <rect class="typebox" x="392" y="188" width="0" height="40"/>
    </clipPath>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="380" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .px { animation: twinkle 3.6s ease-in-out infinite; }
    .p0 { animation-delay: 0s; }
    .p1 { animation-delay: .5s; }
    .p2 { animation-delay: 1.0s; }
    .p3 { animation-delay: 1.5s; }
    .p4 { animation-delay: 2.0s; }
    .p5 { animation-delay: 2.6s; }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    .fl { animation: drift 7s ease-in-out infinite; opacity: .25; }
    .f1 { animation-duration: 9s; animation-delay: -2s; }
    .f2 { animation-duration: 6s; animation-delay: -4s; }
    .f3 { animation-duration: 11s; animation-delay: -1s; }
    .f4 { animation-duration: 8s; animation-delay: -5s; }
    @keyframes drift {
      0%,100% { transform: translate(0,0); opacity: .15; }
      50% { transform: translate(14px,-22px); opacity: .9; }
    }

    .name { font: 800 58px 'Segoe UI', Arial, Helvetica, sans-serif; letter-spacing: 2px; animation: rise 1.1s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .role { font: 600 26px 'Courier New', Courier, monospace; fill: #fbbf24; }
    .typebox { animation: type 2.4s steps(17) .9s forwards; }
    @keyframes type { from { width: 0; } to { width: 270px; } }
    .cursor { fill: #fbbf24; animation: curmove 2.4s steps(17) .9s forwards, blink 1s step-end 3.3s infinite; }
    @keyframes curmove { from { transform: translateX(0); } to { transform: translateX(265px); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .stack { font: 500 18px 'Courier New', Courier, monospace; fill: #94a3b8; animation: fadein 1s ease-out 3s both; }
    .status { font: 500 15px 'Courier New', Courier, monospace; fill: #64748b; animation: fadein 1s ease-out 3.4s both; }
    .on { fill: #4ade80; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .beat { stroke-dasharray: 380 1500; animation: scan 4.5s linear infinite; }
    @keyframes scan { from { stroke-dashoffset: 1880; } to { stroke-dashoffset: 0; } }
    .halo { animation: breathe 5s ease-in-out infinite; transform-origin: 200px 190px; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="halo" cx="200" cy="190" r="190" fill="url(#glow)"/>

    <circle class="fl f0" cx="956" cy="278" r="2.6" fill="#a78bfa"/><circle class="fl f1" cx="408" cy="302" r="2.6" fill="#a78bfa"/><circle class="fl f2" cx="222" cy="268" r="2.0" fill="#a78bfa"/><circle class="fl f3" cx="215" cy="61" r="2.6" fill="#c4b5fd"/><circle class="fl f4" cx="352" cy="47" r="1.2" fill="#22d3ee"/><circle class="fl f0" cx="103" cy="137" r="1.6" fill="#22d3ee"/><circle class="fl f1" cx="980" cy="207" r="2.6" fill="#a78bfa"/><circle class="fl f2" cx="1093" cy="159" r="2.0" fill="#c4b5fd"/><circle class="fl f3" cx="39" cy="83" r="2.6" fill="#67e8f9"/><circle class="fl f4" cx="863" cy="82" r="2.0" fill="#67e8f9"/><circle class="fl f0" cx="500" cy="302" r="2.0" fill="#22d3ee"/><circle class="fl f1" cx="173" cy="95" r="2.6" fill="#22d3ee"/><circle class="fl f2" cx="625" cy="237" r="1.2" fill="#22d3ee"/><circle class="fl f3" cx="31" cy="149" r="1.6" fill="#22d3ee"/><circle class="fl f4" cx="992" cy="232" r="2.6" fill="#c4b5fd"/><circle class="fl f0" cx="179" cy="141" r="2.0" fill="#67e8f9"/><circle class="fl f1" cx="208" cy="199" r="2.0" fill="#22d3ee"/><circle class="fl f2" cx="869" cy="100" r="1.6" fill="#a78bfa"/><circle class="fl f3" cx="236" cy="45" r="1.2" fill="#c4b5fd"/><circle class="fl f4" cx="1027" cy="130" r="1.6" fill="#c4b5fd"/><circle class="fl f0" cx="1072" cy="137" r="1.6" fill="#c4b5fd"/><circle class="fl f1" cx="815" cy="99" r="2.6" fill="#c4b5fd"/><circle class="fl f2" cx="465" cy="40" r="2.0" fill="#67e8f9"/><circle class="fl f3" cx="70" cy="147" r="1.6" fill="#c4b5fd"/><circle class="fl f4" cx="235" cy="61" r="1.6" fill="#a78bfa"/><circle class="fl f0" cx="934" cy="172" r="1.2" fill="#67e8f9"/>

    <!-- window dots -->
    <circle cx="36" cy="34" r="6" fill="#f87171"/>
    <circle cx="58" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="80" cy="34" r="6" fill="#4ade80"/>

    <!-- SK monogram -->
    <rect class="px p0" x="102" y="112" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p1" x="124" y="112" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p2" x="146" y="112" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p3" x="212" y="112" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p4" x="300" y="112" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p5" x="80" y="134" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p0" x="168" y="134" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p1" x="212" y="134" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p2" x="278" y="134" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p3" x="80" y="156" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p4" x="212" y="156" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p5" x="256" y="156" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p0" x="102" y="178" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p1" x="124" y="178" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p2" x="146" y="178" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p3" x="212" y="178" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p4" x="234" y="178" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p5" x="168" y="200" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p0" x="212" y="200" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p1" x="256" y="200" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p2" x="80" y="222" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p3" x="168" y="222" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p4" x="212" y="222" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p5" x="278" y="222" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p0" x="102" y="244" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p1" x="124" y="244" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p2" x="146" y="244" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p3" x="212" y="244" width="18" height="18" rx="3" fill="url(#mono)"/><rect class="px p4" x="300" y="244" width="18" height="18" rx="3" fill="url(#mono)"/>

    <!-- text -->
    <text class="name" x="390" y="165" fill="url(#nameg)">SHREYASHI KAITKE</text>

    <g clip-path="url(#typeclip)">
      <text class="role" x="392" y="216" textLength="265" lengthAdjust="spacingAndGlyphs">&gt; AI &amp; ML Builder</text>
    </g>
    <rect class="cursor" x="394" y="194" width="13" height="26" rx="2"/>

    <text class="stack" x="392" y="262">Python · Machine Learning · FastAPI · React · Blockchain · Linux</text>

    <circle class="dot" cx="398" cy="299" r="5" fill="#4ade80"/>
    <text class="status" x="414" y="304"><tspan class="on">online</tspan>  |  9+ hackathons  |  Springer-accepted paper  |  explainable AI</text>

    <!-- heartbeat line -->
    <path d="M0 338 L60 338 L80 338 L92 312 L108 362 L122 338 L190 338 L260 338 L280 338 L292 312 L308 362 L322 338 L390 338 L460 338 L480 338 L492 312 L508 362 L522 338 L590 338 L660 338 L680 338 L692 312 L708 362 L722 338 L790 338 L860 338 L880 338 L892 312 L908 362 L922 338 L990 338 L1060 338 L1080 338 L1092 312 L1108 362 L1122 338 L1190 338 L1200 338" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="2"/>
    <path class="beat" d="M0 338 L60 338 L80 338 L92 312 L108 362 L122 338 L190 338 L260 338 L280 338 L292 312 L308 362 L322 338 L390 338 L460 338 L480 338 L492 312 L508 362 L522 338 L590 338 L660 338 L680 338 L692 312 L708 362 L722 338 L790 338 L860 338 L880 338 L892 312 L908 362 L922 338 L990 338 L1060 338 L1080 338 L1092 312 L1108 362 L1122 338 L1190 338 L1200 338" fill="none" stroke="url(#beat)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="#243049"/>
</svg>
